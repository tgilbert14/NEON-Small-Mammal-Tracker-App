<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1200,initial-scale=1">
  <title>Small Mammal Tracker social card</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
    body {
      color: #f3e8cb;
      background: #111512;
      font-family: Aptos, "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    .card {
      position: relative;
      width: 1200px;
      height: 630px;
      display: grid;
      grid-template-columns: 42% 58%;
      overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(circle at 8% 88%, rgba(220,227,25,.15), transparent 30%),
        linear-gradient(125deg, #111512 0%, #1b211d 52%, #0c100d 100%);
    }
    .copy {
      position: relative;
      z-index: 3;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 58px 24px 56px 70px;
    }
    .kicker {
      margin-bottom: 25px;
      color: #dce319;
      font-size: 15px;
      font-weight: 850;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      color: #f3e8cb;
      font-family: Iowan Old Style, Palatino Linotype, Book Antiqua, Palatino, Georgia, serif;
      font-size: 91px;
      font-weight: 600;
      letter-spacing: -.062em;
      line-height: .83;
    }
    h1 span, h1 em { display: block; }
    h1 em { color: #dce319; font-style: normal; }
    .promise {
      max-width: 405px;
      margin: 30px 0 0;
      color: #dfd2b3;
      font-size: 22px;
      line-height: 1.36;
    }
    .art { position: relative; min-width: 0; margin: 0; overflow: hidden; }
    .art::before {
      content: "";
      position: absolute;
      z-index: 2;
      inset: 0 auto 0 0;
      width: 165px;
      background: linear-gradient(90deg, #1b211d 0%, rgba(27,33,29,.7) 31%, transparent 100%);
    }
    .art img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: 77% 55%;
    }
    .stamp {
      position: absolute;
      z-index: 4;
      right: 34px;
      bottom: 29px;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 9px 12px;
      color: #f3e8cb;
      background: rgba(17,21,18,.88);
      border: 1px solid rgba(243,232,203,.3);
      border-radius: 999px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .04em;
    }
    .ring {
      width: 16px;
      height: 16px;
      border: 4px solid #e87531;
      border-radius: 50%;
    }
  </style>
</head>
<body>
  <main class="card">
    <section class="copy">
      <div class="kicker">NEON Small Mammal Tracker</div>
      <h1><span>Who moves</span><em>after dark?</em></h1>
      <p class="promise">Meet the tiny lives reshaping the landscape.</p>
    </section>
    <figure class="art">
      <img src="assets/small-mammal-living-poster.png" alt="">
    </figure>
    <div class="stamp"><span class="ring"></span> NEON Explorer Suite · unofficial</div>
  </main>
</body>
</html>
