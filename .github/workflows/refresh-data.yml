name: Refresh NEON data bundle

# Monthly rebuild of the per-site MAMMAL .rds bundles (data/sites/*.rds) PLUS a
# light top-up of the environmental overlays (data/env/*.rds), then redeploy.
# Runs late on the FIRST SATURDAY NIGHT of each month (~11pm Arizona time) so the
# brief redeploy lands off-peak. NEON publishes on a lag, so a monthly pull keeps
# the bundled "database" current.
#
# ENV OVERLAYS: the full 13-year precip/temperature/fruiting history is built
# ONCE, offline, via `Rscript scripts/refresh_env_data.R` (committed to data/env/).
# This workflow only TOPS IT UP each month — SMT_ENV_RECENT_MONTHS re-pulls the
# last ~14 months and merges them in — so it stays current without the heavy full
# pull. Soil water (DP1.00094.001) and RH are intentionally NOT built (the
# high-volume products that made a full pull run 1h37m and get canceled).
#
# REQUIRES three repo secrets (Settings → Secrets and variables → Actions):
#   SHINYAPPS_NAME    your shinyapps account name   (e.g. t-lama)
#   SHINYAPPS_TOKEN   shinyapps.io token            (Account → Tokens)
#   SHINYAPPS_SECRET  shinyapps.io secret
# You can also trigger it manually from the Actions tab (workflow_dispatch);
# tick "skip_download" there to redeploy the already-committed bundle in ~3 min
# (handy for testing the deploy without a full 57-minute NEON re-pull).
#
# FLOW: rebuild bundle → DEPLOY first (so a git issue can never block the
# deploy) → open/update a PR with the refreshed bundle. `main` is a protected
# branch (PRs only), so the bot can't push to it directly; it raises a PR you
# merge at your leisure instead. Merging is optional for the live app — each
# run already deploys from the freshly-downloaded data on the runner.

on:
  schedule:
    # Every Sunday 06:00 UTC == Saturday 23:00 America/Phoenix (Arizona, no DST).
    # Cron can't express "first Saturday of the month", so we fire every Saturday
    # night and let the `gate` job below proceed only on the first one.
    - cron: "0 6 * * 0"
  workflow_dispatch:
    inputs:
      skip_download:
        description: "Skip the NEON re-pull and deploy the committed bundle (fast test)"
        type: boolean
        default: false

permissions:
  contents: write          # commit the refreshed bundle to the PR branch
  pull-requests: write     # open/update the data-refresh PR

jobs:
  # Gate: only the FIRST Saturday night (Arizona time) runs the heavy refresh.
  # Manual runs (workflow_dispatch) always proceed.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run — proceeding."
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          dow=$(TZ='America/Phoenix' date +%u)    # 6 = Saturday
          day=$(TZ='America/Phoenix' date +%-d)   # day-of-month, no leading zero
          if [ "$dow" = "6" ] && [ "$day" -le 7 ]; then
            echo "First Saturday in Arizona (day $day) — proceeding."
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not the first Saturday in Arizona (dow=$dow day=$day) — skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  refresh:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: >
            neonUtilities, dplyr, tibble, tidyr, stringr, rsconnect,
            shiny, bslib, bsicons, plotly, leaflet, DT, shinyjs,
            shinycssloaders, RColorBrewer, htmltools, cpp11

      - name: Rebuild the per-site bundle (full re-pull)
        if: ${{ github.event.inputs.skip_download != 'true' }}
        run: |
          rm -f data/sites/*.rds
          Rscript scripts/refresh_data.R

      # Environmental overlays (precip / temperature / fruiting) — a LIGHT monthly
      # TOP-UP: SMT_ENV_RECENT_MONTHS re-pulls only the last ~14 months and merges
      # into the committed data/env bundle (the full 13-year history is built once,
      # offline). Temp uses timeIndex=30; no soil/RH (the high-volume products that
      # made a full pull too heavy for CI). Time-boxed + non-fatal so it can never
      # stall or block the deploy below.
      - name: Top up the environmental overlays (recent months)
        if: ${{ github.event.inputs.skip_download != 'true' }}
        continue-on-error: true
        timeout-minutes: 40
        env:
          SMT_ENV_RECENT_MONTHS: "14"
        run: |
          Rscript scripts/refresh_env_data.R

      # Deploy right after the bundles are rebuilt (ships fresh mammal + env).
      - name: Deploy to shinyapps.io
        env:
          SHINYAPPS_NAME:   ${{ secrets.SHINYAPPS_NAME }}
          SHINYAPPS_TOKEN:  ${{ secrets.SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
        run: |
          Rscript -e 'rsconnect::setAccountInfo(Sys.getenv("SHINYAPPS_NAME"), Sys.getenv("SHINYAPPS_TOKEN"), Sys.getenv("SHINYAPPS_SECRET")); source("scripts/deploy.R")'

      # Land the refreshed bundle on main via a PR (re-uses one branch/PR each
      # run, so they don't pile up). Skips cleanly when nothing changed.
      - name: Open/update data-refresh PR
        uses: peter-evans/create-pull-request@v6
        with:
          add-paths: |
            data/sites
            data/env
          branch: auto/data-refresh
          delete-branch: true
          commit-message: "data: monthly NEON refresh (mammal + env top-up)"
          title: "data: monthly NEON refresh"
          body: |
            Automated monthly refresh:
            - small-mammal box-trapping (`DP1.10072.001`) → `data/sites/*.rds` (full re-pull)
            - environmental overlays (precip / temp / fruiting) → `data/env/*.rds`
              (recent-months top-up merged into the committed history)

            The live app has already been redeployed from this data — merging
            this PR just keeps the committed bundles (and local runs) in sync.
          labels: automated, data
