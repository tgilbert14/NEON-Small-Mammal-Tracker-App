name: Refresh NEON data bundle

# Monthly rebuild of the per-site .rds bundle (data/sites/*.rds), then redeploy.
# Runs late on the FIRST SATURDAY NIGHT of each month (~11pm Arizona time) so the
# brief redeploy lands off-peak. NEON publishes on a lag, so a monthly pull keeps
# the bundled "database" current.
#
# REQUIRES three repo secrets (Settings → Secrets and variables → Actions):
#   SHINYAPPS_NAME    your shinyapps account name   (e.g. t-lama)
#   SHINYAPPS_TOKEN   shinyapps.io token            (Account → Tokens)
#   SHINYAPPS_SECRET  shinyapps.io secret
# You can also trigger it manually from the Actions tab (workflow_dispatch).
#
# FLOW: rebuild bundle → DEPLOY first (so a git issue can never block the
# deploy) → open/update a PR with the refreshed bundle. `main` is a protected
# branch (PRs only), so the bot can't push to it directly; it raises a PR you
# merge at your leisure instead. Merging is optional for the live app — each
# run already deploys from the freshly-downloaded data on the runner.

on:
  schedule:
    # Every Sunday 06:00 UTC == Saturday 23:00 America/Phoenix (Arizona, no DST).
    # Cron can't express "first Saturday of the month", so we fire every Saturday
    # night and let the `gate` job below proceed only on the first one.
    - cron: "0 6 * * 0"
  workflow_dispatch: {}

permissions:
  contents: write          # commit the refreshed bundle to the PR branch
  pull-requests: write     # open/update the data-refresh PR

jobs:
  # Gate: only the FIRST Saturday night (Arizona time) runs the heavy refresh.
  # Manual runs (workflow_dispatch) always proceed.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run — proceeding."
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          dow=$(TZ='America/Phoenix' date +%u)    # 6 = Saturday
          day=$(TZ='America/Phoenix' date +%-d)   # day-of-month, no leading zero
          if [ "$dow" = "6" ] && [ "$day" -le 7 ]; then
            echo "First Saturday in Arizona (day $day) — proceeding."
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not the first Saturday in Arizona (dow=$dow day=$day) — skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  refresh:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: >
            neonUtilities, dplyr, tibble, tidyr, stringr, rsconnect,
            shiny, bslib, bsicons, plotly, leaflet, DT, shinyjs,
            shinycssloaders, RColorBrewer, htmltools

      - name: Rebuild the per-site bundle (full re-pull)
        run: |
          rm -f data/sites/*.rds
          Rscript scripts/refresh_data.R

      # Deploy BEFORE touching git: the runner already holds the fresh .rds
      # files, so the live app gets current data even if the PR step hiccups.
      - name: Deploy to shinyapps.io
        env:
          SHINYAPPS_NAME:   ${{ secrets.SHINYAPPS_NAME }}
          SHINYAPPS_TOKEN:  ${{ secrets.SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
        run: |
          Rscript -e 'rsconnect::setAccountInfo(Sys.getenv("SHINYAPPS_NAME"), Sys.getenv("SHINYAPPS_TOKEN"), Sys.getenv("SHINYAPPS_SECRET")); source("scripts/deploy.R")'

      # Land the refreshed bundle on main via a PR (re-uses one branch/PR each
      # run, so they don't pile up). Skips cleanly when nothing changed.
      - name: Open/update data-refresh PR
        uses: peter-evans/create-pull-request@v6
        with:
          add-paths: data/sites
          branch: auto/data-refresh
          delete-branch: true
          commit-message: "data: monthly NEON refresh"
          title: "data: monthly NEON refresh"
          body: |
            Automated monthly re-pull of NEON Small Mammal box-trapping data
            (`DP1.10072.001`) into `data/sites/*.rds`.

            The live app has already been redeployed from this data — merging
            this PR just keeps the committed bundle (and local runs) in sync.
          labels: automated, data
