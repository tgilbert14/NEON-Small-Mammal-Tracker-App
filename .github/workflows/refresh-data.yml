name: Refresh NEON data bundle

# Monthly rebuild of the per-site MAMMAL .rds bundles (data/sites/*.rds) + a light
# top-up of the environmental overlays (data/env/*.rds) + the site index, then a
# DIRECT PUSH to main. Runs late on the FIRST SATURDAY NIGHT of each month (~11pm
# Arizona time) so any republish lands off-peak. NEON publishes on a lag, so a
# monthly pull keeps the bundled "database" current.
#
# DEPLOY = git push to main. Posit Connect Cloud watches this repo and auto-
# republishes on every push to main — no shinyapps secrets, no rsconnect deploy
# (matching the WaterChem / Plant / Beetle / Veg siblings). The old shinyapps.io
# path (scripts/deploy.R + rsconnect/shinyapps.io/) has been removed.
#
# REQUIRES one repo secret (Settings → Secrets and variables → Actions):
#   NEON_TOKEN   a free NEON API token from your NEON "My Account" page. From
#                2026-06-30 NEON REQUIRES a token for downloads (before that it only
#                raised the rate limit). Without it the monthly re-pull fails after
#                that date; the deployed app keeps serving its last committed bundle.
# Trigger manually from the Actions tab (workflow_dispatch); tick "skip_download"
# to just rebuild the index from the committed bundles (fast, no NEON re-pull).

on:
  schedule:
    # Every Sunday 06:00 UTC == Saturday 23:00 America/Phoenix (Arizona, no DST).
    # Cron can't express "first Saturday of the month", so we fire every Saturday
    # night and let the `gate` job below proceed only on the first one.
    - cron: "0 6 * * 0"
  workflow_dispatch:
    inputs:
      skip_download:
        description: "Skip the NEON re-pull; just rebuild the index from committed bundles (fast test)"
        type: boolean
        default: false

permissions:
  contents: write          # push the refreshed bundle to main -> Connect Cloud redeploys

jobs:
  # Gate: only the FIRST Saturday night (Arizona time) runs the heavy refresh.
  # Manual runs (workflow_dispatch) always proceed.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run — proceeding."
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          dow=$(TZ='America/Phoenix' date +%u)    # 6 = Saturday
          day=$(TZ='America/Phoenix' date +%-d)   # day-of-month, no leading zero
          if [ "$dow" = "6" ] && [ "$day" -le 7 ]; then
            echo "First Saturday in Arizona (day $day) — proceeding."
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not the first Saturday in Arizona (dow=$dow day=$day) — skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  refresh:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    env:
      NEON_TOKEN: ${{ secrets.NEON_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}   # push to main -> Connect Cloud auto-redeploys

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # rsconnect is a BUILD-TIME tool: scripts/write_manifest.R calls
      # rsconnect::writeManifest(). It is pruned out of the final manifest by the
      # RUNTIME_PKGS reachability walk in that script, so it never ships to Connect.
      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: >
            neonUtilities, dplyr, tibble, tidyr, stringr, jsonlite,
            shiny, bslib, bsicons, plotly, leaflet, DT, shinyjs,
            shinycssloaders, RColorBrewer, htmltools, cpp11,
            rsconnect

      - name: Rebuild the per-site bundle (full NEON re-pull)
        if: ${{ github.event.inputs.skip_download != 'true' }}
        run: |
          rm -f data/sites/*.rds
          Rscript scripts/refresh_data.R

      # Environmental overlays (precip / temperature / fruiting) — a LIGHT monthly
      # TOP-UP: SMT_ENV_RECENT_MONTHS re-pulls only the last ~14 months and merges
      # into the committed data/env bundle (the full 13-year history is built once,
      # offline). Time-boxed + non-fatal so it can never stall or block the push.
      # Non-fatal so a transient env-product hiccup can never block the mammal
      # deploy, but its outcome is CAPTURED (id + step output) and surfaced loudly
      # below instead of silently swallowed, so a repeatedly-failing top-up is visible.
      - name: Top up the environmental overlays (recent months)
        id: envtopup
        if: ${{ github.event.inputs.skip_download != 'true' }}
        continue-on-error: true
        timeout-minutes: 40
        env:
          SMT_ENV_RECENT_MONTHS: "14"
        run: Rscript scripts/refresh_env_data.R

      - name: Flag environmental top-up failure (loud, non-fatal)
        if: ${{ github.event.inputs.skip_download != 'true' && steps.envtopup.outcome == 'failure' }}
        run: |
          echo "::warning title=Env overlay top-up failed::scripts/refresh_env_data.R did not finish (timeout or NEON error). The mammal bundle + index still deployed; the env overlays were NOT topped up this run."

      # Rebuild the site index (per-site summary + mean detection p̂ + species
      # ranges) from the committed bundles — always, so the index stays in lock-step
      # with the data on both the full-pull and skip-download paths.
      - name: Rebuild the site index
        run: Rscript scripts/build_site_index.R

      # Rebuild the "Search the network" index (data/search_index.rds) from the
      # committed bundles — must run on BOTH paths so the search tab never goes
      # stale after a refetch.
      - name: Rebuild the search index
        run: Rscript scripts/build_search_index.R

      # Regenerate the lean manifest.json from the committed runtime files. The
      # per-file checksums must track the refreshed bundles, or Connect Cloud
      # (which validates the committed manifest) serves the OLD snapshot. The
      # script is a check-only lean gate: it stop()s if neonUtilities/arrow leak
      # in (or plotly rides without data.table), and never hand-serializes the
      # canonical writeManifest output beyond the lean prune.
      - name: Regenerate the manifest
        run: Rscript scripts/write_manifest.R

      # PRE-DEPLOY VERIFICATION GATE. Check the rebuilt bundles, indexes, and the
      # manifest BEFORE the push (which is the deploy). If this fails the job stops
      # here, the push never happens, and Connect Cloud keeps serving the last
      # known-good snapshot instead of a truncated/stale refresh.
      - name: Verify rebuilt bundle (pre-deploy gate)
        run: Rscript scripts/verify_bundle.R

      # Commit + push refreshed data DIRECTLY to main — THIS is the deploy: the push
      # makes Connect Cloud auto-republish (no human merge in the loop, matching the
      # siblings). Guarded so it no-ops cleanly when nothing changed.
      - name: Commit & push refreshed data to main
        env:
          ENV_OUTCOME: ${{ steps.envtopup.outcome }}
        run: |
          git config user.name  "neon-data-bot"
          git config user.email "neon-data-bot@users.noreply.github.com"
          git add -A data data-sample manifest.json
          if git diff --cached --quiet; then
            echo "No data changes — nothing to commit or deploy."
          else
            # Build a commit message that reflects what ACTUALLY changed this run:
            # whether the mammal data advanced (from the freshness marker the
            # refresh script wrote) and whether the env top-up succeeded.
            FRESH="freshness unknown"
            if [ -f data/.refresh_state.json ]; then
              if grep -q '"advanced": *true' data/.refresh_state.json; then
                NEW=$(grep -o '"freshest_collectDate": *"[^"]*"' data/.refresh_state.json | head -1 | sed 's/.*"\([^"]*\)"$/\1/')
                FRESH="data advanced to ${NEW:-newer}"
              else
                FRESH="freshest record did NOT advance"
              fi
            fi
            ENV="env top-up ok"
            if [ "${ENV_OUTCOME:-}" = "failure" ]; then ENV="env top-up FAILED (overlays unchanged)"; fi
            if git diff --cached --quiet -- data/env; then ENV="env unchanged"; fi
            git commit -m "data: monthly NEON small-mammal refresh [bot]" \
                       -m "${FRESH}; ${ENV}; index rebuilt."
            git push origin HEAD:main
            echo "Pushed refreshed data to main — Connect Cloud will redeploy. (${FRESH}; ${ENV})"
          fi

  # POST-DEPLOY VERIFICATION. Closes the loop: after the refresh job pushes (which
  # triggers the Connect Cloud republish), confirm the LIVE app + landing page
  # actually come back up. Cold-start aware (Connect workers wake slowly). Runs
  # only on real refresh runs (first Saturday or a manual dispatch), NOT on the
  # every-Saturday no-op gate. A failure here opens/updates a GitHub issue so a
  # silent post-deploy outage is loud instead of a missed red check.
  verify_live:
    needs: [gate, refresh]
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write          # open/update the outage issue on failure
    steps:
      - uses: actions/checkout@v4

      - name: Smoke-check the live surfaces
        id: smoke
        run: |
          # Give Connect Cloud a head start to notice the push before we poll.
          sleep 30
          bash scripts/post_deploy_smoke.sh \
            "Connect Cloud app=https://019ec337-7100-317e-5052-c3bf32ffcb79.share.connect.posit.cloud/" \
            "GitHub Pages landing=https://tgilbert14.github.io/NEON-Small-Mammal-Tracker-App/" \
            | tee smoke.log
          # Propagate the script's exit code (tee would otherwise mask it).
          exit "${PIPESTATUS[0]}"

      - name: Open/update outage issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="🔴 Post-deploy: live app did not come back up after refresh"
          BODY=$(cat <<EOF
          The monthly refresh pushed to \`main\` but the post-deploy smoke check could not
          confirm the live surfaces are up (cold-start budget exhausted).

          Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          \`\`\`
          $(sed -n 's/^  //p' smoke.log 2>/dev/null | tail -n 20)
          \`\`\`

          If Connect Cloud is just slow, re-run the smoke or open the app manually; if it
          stays down, check the Connect Cloud build log for a package-install/deploy failure.
          EOF
          )
          # Dedup: reuse an open issue with this title instead of stacking new ones.
          NUM=$(gh issue list --state open --search "$TITLE in:title" --json number \
                  --jq '.[0].number' 2>/dev/null || echo "")
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "$BODY"
            echo "Updated existing outage issue #$NUM"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label "uptime" 2>/dev/null \
              || gh issue create --title "$TITLE" --body "$BODY"
            echo "Opened new outage issue"
          fi
