name: Verify production after main publication

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: small-mammal-production-health
  cancel-in-progress: true

jobs:
  semantic_health:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          # Full commit history (blobless: no old .rds payloads) so the refresh-candidate
          # ancestry check below can run.
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      # The smoke computes the expected ddl-build digest from this checkout (manifest
      # and file methods) and waits until the live app reports one of them, so a
      # pass proves Connect serves this pushed revision, not merely some revision.
      - name: Wait for Connect Cloud and verify semantic markers
        id: smoke
        env:
          # About 20 minutes of polling: a Connect rebuild that restores packages
          # can take that long before the new revision serves.
          SMOKE_MAX_ATTEMPTS: "30"
          SMOKE_SLEEP_BASE: "20"
          SMOKE_REQUIRE_BUILD: "1"
          SMOKE_REPO_ROOT: ${{ github.workspace }}
        run: |
          sleep 45
          bash scripts/post_deploy_smoke.sh \
            "Connect Cloud app=https://019ec337-7100-317e-5052-c3bf32ffcb79.share.connect.posit.cloud/" \
            "GitHub Pages landing=https://tgilbert14.github.io/NEON-Small-Mammal-Tracker-App/" \
            | tee smoke.log
          exit "${PIPESTATUS[0]}"

      - name: Open or update the production outage issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          title="Production health: Small Mammal semantic smoke failed"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          number=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number')
          body="Main publication ${GITHUB_SHA} did not pass semantic production health after the cold-start budget. Run: ${run_url}"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

      - name: Close a resolved production outage issue
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          title="Production health: Small Mammal semantic smoke failed"
          number=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            gh issue close "$number" --comment "Semantic production health recovered at ${GITHUB_SHA}. Evidence: ${run_url}"
          fi

      # When this push contains the current head of the refresh review branch, the
      # candidate was merged: close its open review issue and name the merge.
      - name: Close the merged data-refresh review issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          branch="automation/small-mammal-data-refresh"
          if ! git fetch --no-tags --quiet --filter=blob:none origin "refs/heads/${branch}:refs/remotes/origin/${branch}"; then
            echo "No ${branch} branch; nothing to close."
            exit 0
          fi
          head=$(git rev-parse "refs/remotes/origin/${branch}")
          if ! git merge-base --is-ancestor "$head" "$GITHUB_SHA"; then
            echo "Refresh candidate ${head} is not in main ${GITHUB_SHA}; leaving its issue open."
            exit 0
          fi
          title="Data refresh ready for review: Small Mammal Tracker"
          numbers=$(gh issue list --state open --label data-refresh --limit 20 --json number,title \
            --jq ".[] | select(.title == \"${title}\") | .number")
          for number in $numbers; do
            gh issue close "$number" --comment "Refresh candidate ${head} was merged into main at ${GITHUB_SHA}. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          done
